<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swapsona</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">Swapsona</span>
    <label class="toggle" title="Enable / Disable">
      <input type="checkbox" id="enableToggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="rules-container" id="rulesList">
    <!-- Rule rows injected by popup.js -->
  </div>

  <button class="add-btn" id="addRuleBtn">+ Add swap</button>

  <script src="popup.js"></script>
</body>
</html>
