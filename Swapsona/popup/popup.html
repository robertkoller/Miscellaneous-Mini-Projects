<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swapsona</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">Swapsona</span>
    <div class="header-controls">
      <button class="dark-btn" id="darkToggle" title="Toggle dark mode">☽</button>
      <label class="toggle" title="Enable / Disable">
        <input type="checkbox" id="enableToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="profile-bar" id="profileBar"></div>

  <div class="rules-container" id="rulesList">
  </div>

  <button class="add-btn" id="addRuleBtn">+ Add swap</button>

  <script src="popup.js"></script>
</body>
</html>
